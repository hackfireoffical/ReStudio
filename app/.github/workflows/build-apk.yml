name: Build ReStudio APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "platform-tools" "build-tools;35.0.0"
      - name: Install Apktool
        run: curl -fL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o "$RUNNER_TEMP/apktool.jar"
      - name: Rebuild decoded APK
        run: java -Xmx5g -jar "$RUNNER_TEMP/apktool.jar" b . -o "$RUNNER_TEMP/mobile-studio-unsigned.apk"
      - name: Align APK
        run: "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$RUNNER_TEMP/mobile-studio-unsigned.apk" "$RUNNER_TEMP/mobile-studio-aligned.apk"
      - name: Create temporary debug key
        run: keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Sign and verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/debug.keystore" --ks-pass pass:android --key-pass pass:android --out mobile-studio-debug.apk "$RUNNER_TEMP/mobile-studio-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose mobile-studio-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-studio-debug-apk
          path: mobile-studio-debug.apk
          if-no-files-found: error
          retention-days: 14
