name: Build ReStudio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'source.tar.gz.part-*'
      - 'app/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify recovered source
        run: test -f app/apktool.yml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Install Apktool
        run: |
          curl -fL --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            -o "$RUNNER_TEMP/apktool.jar"

      - name: Rebuild decoded APK
        run: java -Xmx5g -jar "$RUNNER_TEMP/apktool.jar" b app -o "$RUNNER_TEMP/restudio-unsigned.apk"

      - name: Align APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$RUNNER_TEMP/restudio-unsigned.apk" "$RUNNER_TEMP/restudio-aligned.apk"

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/restudio-debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Sign and verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/restudio-debug.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --out restudio-debug.apk \
            "$RUNNER_TEMP/restudio-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose restudio-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: restudio-debug-apk
          path: restudio-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-test:
    name: Android emulator UI verification
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: restudio-debug-apk
          path: test-apk

      - name: Prepare emulator diagnostics
        run: |
          mkdir -p screenshots
          echo "Runner: $RUNNER_OS / $ImageOS" > screenshots/emulator-diagnostics.txt
          echo "Kernel: $(uname -a)" >> screenshots/emulator-diagnostics.txt
          echo "Memory:" >> screenshots/emulator-diagnostics.txt
          free -h >> screenshots/emulator-diagnostics.txt
          echo "KVM device:" >> screenshots/emulator-diagnostics.txt
          ls -l /dev/kvm >> screenshots/emulator-diagnostics.txt 2>&1 || true
          echo "CPU virtualization flags:" >> screenshots/emulator-diagnostics.txt
          grep -m1 -Eo 'vmx|svm' /proc/cpuinfo >> screenshots/emulator-diagnostics.txt || true

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run ReStudio on Android emulator
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 300
          pre-emulator-launch-script: |
            {
              echo "Emulator binary:"
              "$ANDROID_HOME/emulator/emulator" -version
              echo "AVD config:"
              cat "$ANDROID_AVD_HOME/test.avd/config.ini"
              echo "ADB devices before boot:"
              adb devices -l
            } >> screenshots/emulator-diagnostics.txt 2>&1
          script: |
            set -eu
            echo 'ADB device list after emulator boot'
            adb devices -l | tee screenshots/adb-devices.txt
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            echo 'Installing ReStudio APK on Android 15'
            adb install test-apk/restudio-debug.apk

            echo 'Checking installed package metadata'
            adb shell dumpsys package com.hackfire.restudio > screenshots/package-dump.txt
            grep -q 'versionName=1.1.6' screenshots/package-dump.txt
            grep -q 'versionCode=116' screenshots/package-dump.txt

            echo 'Launching ReStudio'
            adb shell monkey -p com.hackfire.restudio 1
            sleep 5
            adb shell dumpsys activity activities > screenshots/activities.txt
            grep -q 'com.hackfire.restudio' screenshots/activities.txt
            adb exec-out screencap -p > screenshots/app-running.png

            echo 'Opening Android launcher app drawer'
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell input swipe 540 1750 540 450 350
            sleep 3
            adb shell uiautomator dump /sdcard/launcher.xml >/dev/null
            adb pull /sdcard/launcher.xml screenshots/launcher.xml >/dev/null
            grep -q 'ReStudio' screenshots/launcher.xml
            adb exec-out screencap -p > screenshots/launcher-app-drawer.png

            echo 'Launcher UI check passed. Screenshot requires visual inspection before calling the icon verified.'

      - name: Upload emulator screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restudio-android-emulator-evidence
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
