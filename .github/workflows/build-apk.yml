name: Build ReStudio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'source.tar.gz.part-*'
      - 'app/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify recovered source
        run: test -f app/apktool.yml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Install Apktool
        run: |
          curl -fL --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            -o "$RUNNER_TEMP/apktool.jar"

      - name: Rebuild decoded APK
        run: java -Xmx5g -jar "$RUNNER_TEMP/apktool.jar" b app -o "$RUNNER_TEMP/restudio-unsigned.apk"

      - name: Align APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$RUNNER_TEMP/restudio-unsigned.apk" "$RUNNER_TEMP/restudio-aligned.apk"

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/restudio-debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Sign and verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/restudio-debug.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --out restudio-debug.apk \
            "$RUNNER_TEMP/restudio-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose restudio-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: restudio-debug-apk
          path: restudio-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-test:
    name: Android emulator UI verification
    needs: build
    runs-on: macos-15
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: restudio-debug-apk
          path: test-apk

      - name: Run ReStudio on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            mkdir -p screenshots

            echo 'Installing ReStudio APK on a clean Android 15 emulator'
            adb install test-apk/restudio-debug.apk

            echo 'Checking installed package metadata'
            adb shell dumpsys package com.hackfire.restudio > screenshots/package-dump.txt
            grep -q 'versionName=1.1.6' screenshots/package-dump.txt
            grep -q 'versionCode=116' screenshots/package-dump.txt

            echo 'Launching ReStudio'
            adb shell monkey -p com.hackfire.restudio 1
            sleep 5
            adb shell dumpsys activity activities > screenshots/activities.txt
            grep -q 'com.hackfire.restudio' screenshots/activities.txt
            adb exec-out screencap -p > screenshots/app-running.png

            echo 'Opening launcher app drawer to inspect the actual Android icon'
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell input swipe 540 1750 540 450 350
            sleep 3
            adb shell uiautomator dump /sdcard/launcher.xml >/dev/null
            adb pull /sdcard/launcher.xml screenshots/launcher.xml >/dev/null
            grep -q 'ReStudio' screenshots/launcher.xml
            adb exec-out screencap -p > screenshots/launcher-app-drawer.png

            echo 'Opening Android package installer for an update-prompt screenshot'
            adb push test-apk/restudio-debug.apk /sdcard/Download/restudio-debug.apk >/dev/null
            adb shell am start -a android.intent.action.VIEW \
              -d file:///sdcard/Download/restudio-debug.apk \
              -t application/vnd.android.package-archive \
              --grant-read-uri-permission || true
            sleep 4
            adb exec-out screencap -p > screenshots/installer-screen.png
            adb shell uiautomator dump /sdcard/installer.xml >/dev/null 2>&1 || true
            adb pull /sdcard/installer.xml screenshots/installer.xml >/dev/null 2>&1 || true

            echo 'Emulator verification completed; screenshots and UI hierarchy saved.'

      - name: Upload emulator screenshots and UI dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restudio-android-emulator-evidence
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
